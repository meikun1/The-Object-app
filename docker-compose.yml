# Локальная инфраструктура для разработки: PostgreSQL + Redis.
# Запуск: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: object_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: object
      POSTGRES_PASSWORD: object
      POSTGRES_DB: object
    ports:
      - "5432:5432"
    volumes:
      - object_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U object"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: object_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - object_redis:/data

volumes:
  object_pg:
  object_redis:
